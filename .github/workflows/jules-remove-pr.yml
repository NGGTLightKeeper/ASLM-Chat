name: Jules - Remove PR

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: write

jobs:
  close-jules-pr:
    if: github.event.pull_request.user.login == 'google-labs-jules[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Close pull request from Jules
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = pr.number;

            if (pr.state !== "open") {
              core.info(`PR #${number} is already ${pr.state}; nothing to do.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: [
                "This pull request was closed automatically by CI.",
                "",
                "PRs opened by the Jules bot (`google-labs-jules[bot]`) are not reviewed here; documentation changes are handled via the `jules-docs-dev-*` and `jules-patchnotes-dev-*` automation branches.",
              ].join("\n"),
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: number,
              state: "closed",
            });

            core.info(`Closed PR #${number} from ${pr.user.login}.`);
