[project]
name = "sandbox-mcp"
version = "0.1.0"
description = "Minimal Python sandbox MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Docker and sandbox:latest image",
]

[project.scripts]
sandbox-mcp = "sandbox_mcp.server:main"
sandboxd = "sandbox_mcp.daemon:main"
sandboxctl = "sandbox_mcp.ctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox_mcp"]
