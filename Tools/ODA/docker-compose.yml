# Dev-only shell (not used by MCP). Layout matches production: _sandbox / work.
services:
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: sandbox:latest
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /home/sandbox/.cache:rw,nosuid,size=512m
      - /home/sandbox/.config:rw,nosuid,size=256m
      - /home/sandbox/.local:rw,nosuid,exec,size=1g
    volumes:
      - ./tmp/_sandbox:/mnt/data/_sandbox:rw
      - ./tmp/dev/work:/mnt/data/work:rw
    user: "1000:1000"
    working_dir: /mnt/data/work
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec sleep infinity"]
    profiles: ["dev"]
